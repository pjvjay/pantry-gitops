# The Kustomize root ArgoCD renders for the pantry-apps Application.
#
# The `images` block is the single place image pins live. Each app
# repo's CI runs scripts/bump_image_tag.py here, setting the release it
# just cut (newTag X.Y.Z; dev-<sha> before versioning), and pushes —
# that commit IS the deployment. One pin per entry, never latest:
# verify.yml checks it (scripts/check_images.py).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pantry-app
resources:
- migrate-job.yaml
- pantry-api
- pantry-frontend
- pantry-ingress
images:
- name: ghcr.io/pjvjay/pantry-api
  newName: ghcr.io/pjvjay/pantry-api
  newTag: dev-fa76277
- name: ghcr.io/pjvjay/pantry-db-migrate
  newName: ghcr.io/pjvjay/pantry-db-migrate
  newTag: dev-236d827
- name: ghcr.io/pjvjay/pantry-frontend
  newName: ghcr.io/pjvjay/pantry-frontend
  newTag: dev-ff846e7
