# The stage's app namespace (renamed per stage by the Kustomize namespace
# transformer in stages/<stage>/infra/app-ns).
#
# Prune=false,Delete=false: Argo CD never deletes this namespace, whether
# it disappears from git or its Application is deleted. Deleting a
# namespace deletes everything in it (ADR 0005 §5).
apiVersion: v1
kind: Namespace
metadata:
  name: pantry-app
  labels:
    app.kubernetes.io/part-of: pantry-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
