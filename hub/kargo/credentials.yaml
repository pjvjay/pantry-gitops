# Kargo's git credential for this repo: a GitHub App (ADR 0007), the only
# automated writer to pantry-gitops. Same model as the baseline's secrets:
# the values live in the HUB's Key Vault (pantry-infra writes them) and
# ESO projects them. Nothing secret is in git.
#
# The `kargo.akuity.io/cred-type: git` label is what makes Kargo use this
# Secret for git-clone / git-push / git-open-pr against `repoURL`.
#
# App permissions: Contents RW + Pull requests RW + Metadata R, installed
# on pantry-gitops ONLY. Rotate: new key in Key Vault -> ESO refresh
# (<= 1h, or annotate to force) -> Kargo picks it up on next use.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kargo-git-pantry-gitops
  namespace: pantry
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault
    kind: ClusterSecretStore
  target:
    name: kargo-git-pantry-gitops
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: https://github.com/pjvjay/pantry-gitops.git
        githubAppID: "{{ .appId }}"
        githubAppInstallationID: "{{ .installationId }}"
        githubAppPrivateKey: "{{ .privateKey }}"
  data:
    - secretKey: appId
      remoteRef:
        key: kargo-github-app-id
    - secretKey: installationId
      remoteRef:
        key: kargo-github-app-installation-id
    - secretKey: privateKey
      remoteRef:
        key: kargo-github-app-private-key
