# The pipeline: Warehouse -> dev -> staging -> prod.
#
# A Stage only accepts Freight from its `sources`. `stages: [x]` means
# "Freight that was promoted to x and verified there". Verified = the
# stage's Argo CD Applications reached the promoted commit and are Healthy
# AND every AnalysisTemplate under `verification` passed
# (hub/kargo/analysis-templates.yaml).
#
# `host` args must equal stages/<stage>/params (checked in CI).
#
# Each Stage syncs Argo CD Applications pantry-{infra,apps}-<stage>, which
# carry `kargo.akuity.io/authorized-stage: pantry:<stage>` (ADR 0005).
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: pantry
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: pantry
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - task:
            name: render-and-push
  verification:
    analysisTemplates:
      - name: pantry-smoke
    args:
      - name: host
        value: dev.pantry.example.com
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: pantry
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: pantry
      sources:
        stages:
          - dev
        # INTERIM ONLY, until dev is adopted (KARGO-23): dev can't be promoted
        # yet, so staging may also take Freight straight from the Warehouse.
        # Remove at cutover; staging then only accepts Freight proven in dev.
        # check_gitops.py fails CI if this remains after dev is adopted.
        direct: true
  promotionTemplate:
    spec:
      steps:
        - task:
            name: render-and-push
  # Staging is the gate in front of prod: smoke AND the API contract.
  verification:
    analysisTemplates:
      - name: pantry-smoke
      - name: pantry-api-contract
    args:
      - name: host
        value: staging.pantry.example.com
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: pantry
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: pantry
      sources:
        # Only Freight proven in staging. Never direct.
        stages:
          - staging
        # ...and that has been running in staging for at least this long
        # (KARGO-21). Catches slow failures (leaks, cron paths, token
        # expiry) that a single verification run can't.
        requiredSoakTime: 1h
  promotionTemplate:
    spec:
      steps:
        - task:
            name: render-and-pr
  # Post-deploy check only. Prod's real gates are upstream (staging
  # verification + soak) and the two approvals (ADR 0007).
  verification:
    analysisTemplates:
      - name: pantry-smoke
    args:
      - name: host
        value: pantry.example.com
