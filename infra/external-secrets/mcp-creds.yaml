# Bearer tokens for the pantry-api MCP endpoint (/mcp), projected into
# pantry-app as MCP_AUTH_TOKENS.
#
# The Key Vault value is `label:secret[,label:secret]` — one or more
# comma-separated entries, each a short label (shown as submitter /
# reviewer on origin submissions) and a secret of at least 16 chars,
# e.g. `terraform:Xk9...`. pantry-infra's Terraform creates the
# `pantry-mcp-tokens` entry; rotate it there and every consumer picks
# the new value up within refreshInterval.
#
# The API Deployment mounts the resulting Secret as `optional: true`:
# a cluster without this Key Vault entry still rolls, with /mcp serving
# anonymously and the submission (write) tools disabled.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pantry-mcp-credentials
  namespace: pantry-app
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-key-vault
    kind: ClusterSecretStore
  target:
    name: pantry-mcp-credentials
    template:
      type: Opaque
      engineVersion: v2
      data:
        tokens: "{{ .tokens }}"
  data:
    - secretKey: tokens
      remoteRef:
        key: pantry-mcp-tokens
