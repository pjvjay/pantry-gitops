# Both pantry namespaces, applied before anything that lives in them.
#
# Prune=false,Delete=false: Argo CD must never delete these namespaces,
# even if this file leaves git or the pantry-infra Application is deleted.
# This protects the database through the Kargo cutover (KARGO-23, ADR 0005).
apiVersion: v1
kind: Namespace
metadata:
  name: pantry-app
  labels:
    app.kubernetes.io/part-of: pantry-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: pantry-db
  labels:
    app.kubernetes.io/part-of: pantry-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
